# PPO navigation-policy training configuration
#
# Trains the NAVIGATION layer only.  Zone selection is handled by the SIMAGIA
# multi-agent system (Contract Net auction); this policy drives the robot to a
# target the MAS has already chosen.  The trained model drops into
# sentinel_mas/agents/patrol.py::NavigationStub.move() via src/rl/policy_runner.py.

env:
  # Map layout - mirrors SIMAGIA sentinel_mas/config/settings.py
  # Positions are on SIMAGIA's 0..100 dashboard grid; map_scale converts to
  # metres so the action space matches the robot's real m/s envelope.
  map_scale: 0.2                 # metres per grid unit (100 units = 20 m room)
  zone_pos:
    exterior:    [50.0, 13.0]
    server_room: [22.0, 35.0]
    lab:         [78.0, 35.0]
    corridor:    [50.0, 57.0]
    lobby:       [50.0, 83.0]
  base_pos:      [50.0, 70.0]    # patrol dock / idle position

  # Robot velocity envelope - from unitree-g1-webots rpc_commands.py
  # Booster T1 safe walking limits (MOVEMENT_COMMANDS). Asymmetric vx is real.
  velocity_limits:
    vx:   [-0.1, 0.7]            # m/s   forward / reverse
    vy:   [-0.1, 0.1]            # m/s   lateral strafe
    vyaw: [-0.2, 0.2]            # rad/s turn rate

  # Episode dynamics
  control_dt: 0.1                # s per control step (~10 Hz /cmd_vel)
  goal_radius: 0.5               # m, "arrived" threshold
  max_episode_steps: 400         # ~40 s of sim time at 10 Hz

  reward:
    progress: 1.0                # potential-based reward per metre closed
    goal_reached: 50.0           # terminal bonus for reaching the target zone
    step_penalty: 0.01           # per-step cost (encourages directness)
    action_smoothness_penalty: 0.02  # penalise jerky velocity changes (biped stability)
    out_of_bounds_penalty: 1.0   # penalty for leaving the arena

algorithm:
  name: "PPO"
  policy: "MlpPolicy"
  device: "cpu"
  n_envs: 8                      # parallel envs (nav training is cheap & fast)
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  total_timesteps: 1_000_000     # ~30-60 min on CPU with n_envs=8
  progress_freq: 10_000          # print a progress line every N steps

evaluation:
  eval_freq: 10_000
  n_eval_episodes: 20
  baselines:
    - "straight_line"            # go-to-goal bee-line (ignores dynamics)
    - "proportional_controller"  # hand-tuned P controller on heading + distance
